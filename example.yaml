# 注释格式：类型  可选标记  说明；必填项不写"可选"

version: 1 # int  只能为 1
questions: # list  题目列表
  # ===== 题一：有小题，题目层只放共享信息，细节写在每个 item =====
  - subject: 物理 # string  科目
    authors: [张三, 李四] # string[]  出题人，按署名顺序
    date: '2026.11.22' # string  出题时间 yyyy.mm.dd
    revision: 10 # int  修订版本 tenths，10 表示 1.0，每次修订 +1
    points: 13.0 # number  总分值，0.5 的整数倍，等于各 item 分值之和
    instruction: '阅读材料，完成下列问题。' # string  引导语
    source: 金太阳联考 # string  来源，纯文本
    plugins: # map[]  可选  本题启用的插件，每项见对应 *.schema.json
      - name: math # enum  插件名
      - name: photo # enum  插件名
        allow_upload: true # bool  可选  是否允许考生上传 png 作答
    number: 18 # int  可选  自定义大题题号，整卷抽出时保留原号
    items: # list  小题列表，与题目层细节字段互斥
      - type: choose # enum  题型 choose / blank / judge / short
        knowledge: [牛顿第二定律, 摩擦力] # string[]  可选  知识点
        points: 3.0 # number  分值，0.5 的整数倍
        stem: '物块沿斜面向上滑动时的加速度大小 {{math}}$a=\frac{F-f}{m}{{/math}} 为？ A. 2.0 B. 2.5 C. 5.0 D. 7.5 m/s²；受力见 {{photo}}图1{{/photo}}。' # string  题目内容，可内联插件
        answer: 2 # int | int[]  正确答案序号，从 1 起；多选写升序列表
        scoring: auto # enum  评分方式 auto / smart / manual
        regex_points: # list  可选  正则匹配给分点，留空写 null
          - pattern: '2\.5|B' # string  正则表达式
            point: 加速度数值 # string  可选  给分点名称
            score: 3.0 # number  可选  该点分值
        standard_answer: 'B（2.5 m/s²）' # string  可选  标准答案文字
        rubric: null # string  可选  评分细则，留空写 null
      - type: blank # enum  题型
        knowledge: [正交分解, 滑动摩擦力] # string[]  可选  知识点
        points: 4.0 # number  分值
        stem: '垂直斜面方向 {{math}}$N=mg\cos\theta{{/math}}，故摩擦力大小为 {{1}} N，方向 {{2}}。' # string  {{n}} 为空位编号
        answer: # list | null  答案，按空位编号顺序
          - value: 10 # number  数值答案
            tol: 0.02 # number  可选  相对容差，0.02 表示 ±2%
            unit: N # string  可选  单位
          - 沿斜面向下 # string  文本答案，多种写法用 | 分隔
        scoring: auto # enum  评分方式
        regex_points: # list  可选  正则匹配给分点
          - pattern: '沿斜面向下|沿斜面方向向下' # string  正则表达式
            point: 摩擦力方向 # string  可选  给分点名称
            score: 2.0 # number  可选  该点分值
        standard_answer: '10 N，沿斜面向下' # string  可选  标准答案
        rubric: null # string  可选  评分细则
      - type: judge # enum  题型
        knowledge: [摩擦力方向] # string[]  可选  知识点
        points: 2.0 # number  分值
        stem: '滑动摩擦力的方向总是与物体的运动方向相反。' # string  题目内容
        answer: false # bool  答案只能是 true / false
        scoring: auto # enum  评分方式
        regex_points: null # list  可选  无正则给分点写 null
        standard_answer: '错误：应与相对运动方向相反。' # string  可选  标准答案
        rubric: null # string  可选  评分细则
      - type: short # enum  题型
        knowledge: [牛顿第二定律, 运动学] # string[]  可选  知识点
        points: 4.0 # number  分值
        stem: '求物块在 2 s 末的速度大小。' # string  题目内容
        answer: null # string  可选  简答题答案留空，判分走标准答案与细则
        scoring: manual # enum  评分方式
        regex_points: # list  可选  正则匹配给分点
          - pattern: '5\s*m/s|5\.0\s*m/s' # string  正则表达式
            point: 速度大小 # string  可选  给分点名称
            score: 2.0 # number  可选  该点分值
        standard_answer: '由 {{math}}$v=at=5\,\mathrm{m/s}${{/math}}。' # string  可选  标准答案
        rubric: '写出 v=at 得 2 分；结果 5 m/s 得 2 分。' # string  可选  评分细则

  # ===== 题二：无小题，细节直接写在题目层，化学 + excel + math 插件 =====
  - subject: 化学 # string  科目
    authors: [王五] # string[]  出题人
    date: '2026.11.20' # string  出题时间
    revision: 11 # int  修订版本，11 表示 1.1
    points: 4.0 # number  分值，本题无 item，此值即该题分值
    instruction: '根据材料回答问题。' # string  引导语
    source: 校级月考 # string  来源
    plugins: # map[]  可选  本题启用的插件
      - name: chemistry # enum  插件名
        engine: mhchem # enum  可选  化学方程式引擎
      - name: excel # enum  插件名
        engine: gfm # enum  可选  表格引擎
      - name: math # enum  插件名
    number: 20 # int  可选  自定义大题题号
    type: blank # enum  题型
    knowledge: [化学平衡, 平衡常数] # string[]  可选  知识点
    stem: | # string  题目内容，块标量可写多行与内联插件
      在 2 L 密闭容器中发生反应 {{chem}}$\ce{2SO2 + O2 <=> 2SO3}${{/chem}}，起始投入见下表。
      {{excel}}
      | 物质 | 起始/mol | 转化/mol | 平衡/mol |
      | --- | --- | --- | --- |
      | SO2 | 1.0 | 0.8 | 0.2 |
      | O2 | 0.5 | {{1}} | 0.1 |
      | SO3 | 0 | 0.8 | 0.8 |
      {{/excel}}
      该温度下的平衡常数 {{math}}$K={{2}}${{/math}}。
    answer: # list | null  答案，按空位编号顺序
      - value: 0.4 # number  数值答案
        tol: 0.02 # number  可选  相对容差
      - value: 160 # number  数值答案
        tol: 0.01 # number  可选  相对容差
    scoring: auto # enum  评分方式
    regex_points: null # list  可选  正则匹配给分点
    standard_answer: 'O2 转化 0.4 mol，K = 0.8²/(0.2²×0.1) = 160。' # string  可选  标准答案
    rubric: null # string  可选  评分细则
